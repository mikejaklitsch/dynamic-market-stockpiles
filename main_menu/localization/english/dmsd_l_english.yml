l_english:
 STATIC_MODIFIER_NAME_dws_stockpile_scaling:0 "Market-Scaled Stockpile"
 STATIC_MODIFIER_DESC_dws_stockpile_scaling:0 "Adjusts stockpile capacity by a percentage derived from the market's total traded value. A market trading 2,500 gold has no adjustment. Below that threshold, capacity shrinks proportionally down to a minimum of 5%. Above it, capacity grows with no upper limit."
 STATIC_MODIFIER_NAME_dws_no_burgher_trading:0 "Burgher Trading Disabled"
 STATIC_MODIFIER_DESC_dws_no_burgher_trading:0 "Burghers can no longer generate trades."
 rule_dmsd_stockpiles:0 "Dynamic Stockpiles"
 setting_dmsd_stockpiles_enabled:0 "Enabled"
 setting_dmsd_stockpiles_enabled_desc:0 "Market stockpile capacity scales dynamically based on total traded value."
 setting_dmsd_stockpiles_disabled:0 "Disabled"
 setting_dmsd_stockpiles_disabled_desc:0 "Stockpile capacity uses default fixed values. Existing scaling is removed."
 rule_dmsd_slider_demand:0 "Slider Demand"
 setting_dmsd_slider_demand_enabled:0 "Enabled"
 setting_dmsd_slider_demand_enabled_desc:0 "Court, diplomatic, stability, and cultural spending generates regional goods demand in the capital market."
 setting_dmsd_slider_demand_disabled:0 "Disabled"
 setting_dmsd_slider_demand_disabled_desc:0 "Slider spending does not generate goods demand. Existing demands are cleaned up."
 rule_dws_burgher_trading:0 "Burgher Trading"
 setting_dws_burgher_trading_enabled:0 "Enabled"
 setting_dws_burgher_trading_enabled_desc:0 "Burghers generate trades normally."
 setting_dws_burgher_trading_disabled:0 "Disabled"
 setting_dws_burgher_trading_disabled_desc:0 "Burghers no longer generate trades. Removes all burgher trade capacity."
